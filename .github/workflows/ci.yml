name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Canlı sunucuyla aynı sürüm (cPanel: MariaDB 10.6)
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: nakliyat
          MARIADB_USER: nakliyat
          MARIADB_PASSWORD: nakliyat
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: mysql://nakliyat:nakliyat@127.0.0.1:3306/nakliyat
      JWT_ACCESS_SECRET: ci-test-secret
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Veritabanı migration
        run: pnpm --filter @nakliyat/api db:deploy
      - name: API e2e testleri
        run: pnpm --filter @nakliyat/api test:e2e
      - run: pnpm build
