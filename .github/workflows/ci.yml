name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nakliyat
          POSTGRES_PASSWORD: nakliyat
          POSTGRES_DB: nakliyat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nakliyat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nakliyat:nakliyat@localhost:5432/nakliyat?schema=public
      JWT_ACCESS_SECRET: ci-test-secret
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Veritabanı migration
        run: pnpm --filter @nakliyat/api db:deploy
      - name: API e2e testleri
        run: pnpm --filter @nakliyat/api test:e2e
      - run: pnpm build
