name: CI

# GitHub Actions dakikası sınırlı (ücretsiz pakette ayda 2.000 dk). Bu yüzden:
# - Testler yalnızca PR'da çalışır; main'e birleşince tekrar çalışmaz (canlı paketi deploy-cpanel.yml üretir).
# - Aynı PR'a yeni gönderim gelince eski çalışma iptal edilir.
# - Yalnızca mobil uygulama ya da belge değiştiyse tarayıcı testleri atlanır.
on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Site (web/API) etkileniyor mu? Etkilenmiyorsa uzun tarayıcı testleri çalışmaz.
  degisiklik:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.bak.outputs.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: bak
        run: |
          if git diff --name-only ${{ github.event.pull_request.base.sha }} HEAD | grep -qvE '^(apps/mobile/|docs/)|\.md$'; then
            echo "site=true" >> "$GITHUB_OUTPUT"
          else
            echo "site=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    runs-on: ubuntu-latest
    services:
      # Canlı sunucuyla aynı sürüm (Veridyen Junior.js: MariaDB 10.11)
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: nakliyat
          MARIADB_USER: nakliyat
          MARIADB_PASSWORD: nakliyat
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: mysql://nakliyat:nakliyat@127.0.0.1:3306/nakliyat
      JWT_ACCESS_SECRET: ci-test-secret
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Veritabanı migration
        run: pnpm --filter @nakliyat/api db:deploy
      - name: API e2e testleri
        run: pnpm --filter @nakliyat/api test:e2e
      - run: pnpm build

  # Tarayıcıda uçtan uca testler (Playwright, erişilebilirlik dahil).
  # Canlıdaki gibi derlenmiş API + Next.js standalone çıktısıyla çalışır.
  # PageSpeed ölçümü (Lighthouse) ayda bir: lighthouse.yml
  tarayici:
    needs: degisiklik
    if: needs.degisiklik.outputs.site == 'true'
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: nakliyat
          MARIADB_USER: nakliyat
          MARIADB_PASSWORD: nakliyat
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: mysql://nakliyat:nakliyat@127.0.0.1:3306/nakliyat
      JWT_ACCESS_SECRET: ci-test-secret
      NEXT_TELEMETRY_DISABLED: 1
      API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Veritabanı migration
        run: pnpm --filter @nakliyat/api db:deploy
      - name: Playwright tarayıcısı
        run: pnpm --filter @nakliyat/web exec playwright install --with-deps chromium
      - name: Uçtan uca testler (mobil + masaüstü)
        run: pnpm --filter @nakliyat/web test:e2e
      - name: Raporları sakla
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: tarayici-raporlari
          path: apps/web/playwright-report/
          retention-days: 14
