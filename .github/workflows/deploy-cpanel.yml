name: Canlı sürüm paketi

# Sunucu dışarıdan SSH kabul etmiyor. Bu yüzden deploy "çekme" ile çalışır:
# 1. Bu iş akışı API ve web paketlerini üretip GitHub Release olarak yayınlar.
# 2. Sunucudaki scripts/server-deploy.sh (cron ile) yeni sürümü görüp indirir ve kurar.
# Kurulum: docs/deployment-cpanel.md
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release-production

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Sunucu CloudLinux (RHEL tabanlı). Migration motorunun o platform için de inmesi gerekir.
      # Sunucu OpenSSL 1.1.1k: yalnızca bu motor gerekli (paket ~46 MB küçülür, disk kotası için)
      PRISMA_CLI_BINARY_TARGETS: rhel-openssl-1.1.x
      GH_TOKEN: ${{ github.token }}
      KEEP_RELEASES: 3
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Sayfalar derlenirken canlı API'den veri çekilir. Canlı API yanıt vermiyorsa (ör. sunucudaki bir
      # sorun yüzünden kapalıysa) il sayfaları 60 sn sınırına takılıp derleme düşer ve düzeltme de
      # yayınlanamaz. O durumda derleme kapalı bir yerel adresle API'siz yapılır; sayfalar canlıda
      # yeniden doğrulanınca veriyi alır.
      - name: Canlı API derleme için erişilebilir mi
        run: |
          if curl -fsS --max-time 15 "${{ vars.NEXT_PUBLIC_API_URL || 'https://api.evdenevenakliyat.app' }}/v1/health" | grep -q '"status":"ok"'; then
            echo "Canlı API yanıt veriyor, sayfalar canlı veriyle derlenecek."
          else
            echo "::warning::Canlı API yanıt vermiyor; sayfalar API verisi olmadan derlenecek."
            echo "API_URL=http://127.0.0.1:4999" >> "$GITHUB_ENV"
          fi
      - name: Paketleri üret
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          RELEASE_TAG: surum-${{ github.run_number }}
        run: ./scripts/package-release.sh

      - name: Arşivle
        run: |
          cp scripts/server-deploy.sh scripts/db-backup.sh scripts/db-restore.sh out/
          tar -czf release.tar.gz -C out .
          ls -lh release.tar.gz

      - name: Release olarak yayınla
        run: |
          TAG="surum-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release.tar.gz \
            --target "$GITHUB_SHA" \
            --title "Sürüm ${GITHUB_RUN_NUMBER}" \
            --notes "Commit: ${GITHUB_SHA}" \
            --latest
          # Eski sürümleri sil, sadece son birkaçını tut
          gh release list --limit 100 --json tagName --jq ".[${KEEP_RELEASES}:][].tagName" \
            | xargs -r -n1 gh release delete --cleanup-tag --yes
