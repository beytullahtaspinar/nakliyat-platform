name: cPanel'e deploy

# Şimdilik elle tetiklenir (Actions > cPanel'e deploy > Run workflow).
# Gerekli secret'lar ve ilk kurulum: docs/deployment-cpanel.md
on:
  workflow_dispatch:

concurrency: deploy-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NODE_MAJOR: "22"
      SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
      API_DIR: ${{ vars.CPANEL_API_DIR }}
      WEB_DIR: ${{ vars.CPANEL_WEB_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Paketleri üret
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: ./scripts/package-release.sh

      # cPanel anahtar oluştururken şifre zorunlu tutuyor. Şifre verilmişse
      # anahtar yalnızca bu geçici makinede şifresiz hale getirilir.
      - name: SSH anahtarını hazırla
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.CPANEL_SSH_KEY_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$SSH_KEY_PASSPHRASE" ]; then
            ssh-keygen -p -P "$SSH_KEY_PASSPHRASE" -N "" -f ~/.ssh/id_deploy > /dev/null
          fi
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' > ~/.ssh/config
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts

      # CloudLinux Node.js Selector, node_modules klasörünü sanal ortamda tutar ve
      # uygulama klasörüne sembolik bağ olarak ekler. Bu yüzden iki ayrı hedefe yüklüyoruz.
      - name: API'yi yükle
        run: |
          RSH="ssh -p ${SSH_PORT:-22}"
          rsync -az --delete --exclude node_modules --exclude .env --exclude tmp -e "$RSH" out/api/ "$SSH_USER@$SSH_HOST:$API_DIR/"
          rsync -az --delete -e "$RSH" out/api/node_modules/ "$SSH_USER@$SSH_HOST:nodevenv/$API_DIR/$NODE_MAJOR/lib/node_modules/"

      - name: Web'i yükle
        run: |
          RSH="ssh -p ${SSH_PORT:-22}"
          rsync -az --delete --exclude node_modules --exclude .env --exclude tmp -e "$RSH" out/web/ "$SSH_USER@$SSH_HOST:$WEB_DIR/"
          rsync -az --delete -e "$RSH" out/web/node_modules/ "$SSH_USER@$SSH_HOST:nodevenv/$WEB_DIR/$NODE_MAJOR/lib/node_modules/"

      - name: Migration ve yeniden başlatma
        run: |
          ssh -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" bash -s <<SCRIPT
          set -e
          # Selector node_modules bağını ancak npm install sonrası kurar; yoksa biz kuralım.
          for DIR in $API_DIR $WEB_DIR; do
            [ -e ~/\$DIR/node_modules ] || ln -s ~/nodevenv/\$DIR/$NODE_MAJOR/lib/node_modules ~/\$DIR/node_modules
          done
          source ~/nodevenv/$API_DIR/$NODE_MAJOR/bin/activate
          cd ~/$API_DIR
          npx prisma migrate deploy
          mkdir -p tmp && touch tmp/restart.txt
          mkdir -p ~/$WEB_DIR/tmp && touch ~/$WEB_DIR/tmp/restart.txt
          SCRIPT

      - name: Sağlık kontrolü
        run: curl -fsS --retry 5 --retry-delay 5 "${{ vars.NEXT_PUBLIC_API_URL }}/v1/health"
