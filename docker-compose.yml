# Sadece yerel geliştirme için. Canlı ortam cPanel üzerinde çalışır (docs/deployment-cpanel.md).
# Sürüm canlı sunucuyla aynı tutulur: MariaDB 10.6.
services:
  mariadb:
    image: mariadb:10.6
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: nakliyat
      MARIADB_USER: nakliyat
      MARIADB_PASSWORD: nakliyat
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
